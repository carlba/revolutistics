<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Revolutistics – Transactions</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #f5f5f5;
        color: #333;
        min-height: 100vh;
      }

      header {
        background: #191c5e;
        color: #fff;
        padding: 1rem 2rem;
        display: flex;
        align-items: center;
        gap: 1rem;
      }

      header h1 {
        font-size: 1.4rem;
        font-weight: 600;
        letter-spacing: 0.02em;
      }

      header span.logo {
        font-size: 1.6rem;
      }

      .toolbar {
        padding: 1rem 2rem;
        display: flex;
        gap: 0.75rem;
        align-items: center;
        background: #fff;
        border-bottom: 1px solid #e0e0e0;
        flex-wrap: wrap;
      }

      .toolbar input[type='text'] {
        padding: 0.45rem 0.75rem;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 0.9rem;
        width: 220px;
      }

      .toolbar select {
        padding: 0.45rem 0.75rem;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 0.9rem;
      }

      .toolbar button {
        padding: 0.45rem 1rem;
        background: #191c5e;
        color: #fff;
        border: none;
        border-radius: 6px;
        font-size: 0.9rem;
        cursor: pointer;
      }

      .toolbar button:hover {
        background: #2a2f8c;
      }

      .toolbar .spacer {
        flex: 1;
      }

      #status {
        font-size: 0.85rem;
        color: #777;
      }

      main {
        padding: 1.5rem 2rem;
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        background: #fff;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
        font-size: 0.875rem;
      }

      thead {
        background: #191c5e;
        color: #fff;
      }

      thead th {
        padding: 0.75rem 1rem;
        text-align: left;
        font-weight: 500;
        white-space: nowrap;
      }

      tbody tr {
        border-bottom: 1px solid #f0f0f0;
        transition: background 0.15s;
        cursor: pointer;
      }

      tbody tr:hover {
        background: #f9f9ff;
      }

      tbody td {
        padding: 0.65rem 1rem;
        white-space: nowrap;
      }

      .amount {
        font-weight: 600;
        font-family: monospace;
      }

      .amount.credit {
        color: #2e7d32;
      }

      .amount.debit {
        color: #c62828;
      }

      .badge {
        display: inline-block;
        padding: 0.15rem 0.55rem;
        border-radius: 99px;
        font-size: 0.75rem;
        font-weight: 500;
        text-transform: uppercase;
      }

      .badge.completed {
        background: #e8f5e9;
        color: #2e7d32;
      }

      .badge.pending {
        background: #fff8e1;
        color: #f57f17;
      }

      .badge.failed {
        background: #ffebee;
        color: #c62828;
      }

      .badge.reverted {
        background: #ede7f6;
        color: #4527a0;
      }

      /* Modal */
      .modal-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        z-index: 100;
        align-items: center;
        justify-content: center;
      }

      .modal-overlay.open {
        display: flex;
      }

      .modal {
        background: #fff;
        border-radius: 10px;
        width: 90%;
        max-width: 680px;
        max-height: 80vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.18);
      }

      .modal-header {
        padding: 1rem 1.5rem;
        background: #191c5e;
        color: #fff;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .modal-header h2 {
        font-size: 1rem;
        font-weight: 600;
      }

      .modal-close {
        background: none;
        border: none;
        color: #fff;
        font-size: 1.4rem;
        cursor: pointer;
        line-height: 1;
      }

      .modal-body {
        padding: 1.25rem 1.5rem;
        overflow-y: auto;
        flex: 1;
      }

      pre {
        font-size: 0.8rem;
        background: #f5f5f5;
        padding: 1rem;
        border-radius: 6px;
        overflow-x: auto;
        white-space: pre-wrap;
        word-break: break-all;
      }

      #empty-state {
        text-align: center;
        padding: 3rem;
        color: #999;
        display: none;
      }

      #loading {
        text-align: center;
        padding: 3rem;
        color: #777;
      }
    </style>
  </head>
  <body>
    <header>
      <span class="logo">💳</span>
      <h1>Revolutistics</h1>
    </header>

    <div class="toolbar">
      <input type="text" id="search" placeholder="Search reference, type…" />
      <select id="state-filter">
        <option value="">All states</option>
        <option value="completed">Completed</option>
        <option value="pending">Pending</option>
        <option value="failed">Failed</option>
        <option value="reverted">Reverted</option>
      </select>
      <select id="type-filter">
        <option value="">All types</option>
        <option value="transfer">Transfer</option>
        <option value="payment">Payment</option>
        <option value="refund">Refund</option>
        <option value="exchange">Exchange</option>
        <option value="topup">Topup</option>
      </select>
      <button id="refresh-btn">⟳ Refresh</button>
      <div class="spacer"></div>
      <span id="status">Loading…</span>
    </div>

    <main>
      <div id="loading">Loading transactions…</div>
      <div id="empty-state">No transactions found.</div>
      <table id="tx-table" style="display:none">
        <thead>
          <tr>
            <th>Date</th>
            <th>Type</th>
            <th>State</th>
            <th>Reference</th>
            <th>Amount</th>
            <th>Currency</th>
            <th>Description</th>
          </tr>
        </thead>
        <tbody id="tx-body"></tbody>
      </table>
    </main>

    <!-- Detail modal -->
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal">
        <div class="modal-header">
          <h2 id="modal-title">Transaction Detail</h2>
          <button class="modal-close" id="modal-close">✕</button>
        </div>
        <div class="modal-body">
          <pre id="modal-content"></pre>
        </div>
      </div>
    </div>

    <script>
      let allTransactions = [];

      function formatDate(iso) {
        if (!iso) return '—';
        return new Date(iso).toLocaleString();
      }

      function formatAmount(legs) {
        if (!Array.isArray(legs) || legs.length === 0) return '—';
        const leg = legs[0];
        const sign = leg.amount >= 0 ? '+' : '';
        return `${sign}${Number(leg.amount).toFixed(2)}`;
      }

      function getCurrency(legs) {
        if (!Array.isArray(legs) || legs.length === 0) return '—';
        return legs[0].currency ?? '—';
      }

      function getDescription(legs) {
        if (!Array.isArray(legs) || legs.length === 0) return '—';
        return legs[0].description ?? '—';
      }

      function badgeClass(state) {
        if (!state) return '';
        return state.toLowerCase();
      }

      function renderRows(transactions) {
        const tbody = document.getElementById('tx-body');
        const table = document.getElementById('tx-table');
        const empty = document.getElementById('empty-state');
        const loading = document.getElementById('loading');

        loading.style.display = 'none';
        tbody.innerHTML = '';

        if (transactions.length === 0) {
          table.style.display = 'none';
          empty.style.display = 'block';
          return;
        }

        empty.style.display = 'none';
        table.style.display = 'table';

        transactions.forEach(tx => {
          const amountVal = Array.isArray(tx.legs) && tx.legs[0] ? tx.legs[0].amount : null;
          const amountClass =
            amountVal === null ? '' : amountVal >= 0 ? 'credit' : 'debit';
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${formatDate(tx.created_at)}</td>
            <td>${tx.type ?? '—'}</td>
            <td><span class="badge ${badgeClass(tx.state)}">${tx.state ?? '—'}</span></td>
            <td>${tx.reference ?? '—'}</td>
            <td class="amount ${amountClass}">${formatAmount(tx.legs)}</td>
            <td>${getCurrency(tx.legs)}</td>
            <td>${getDescription(tx.legs)}</td>
          `;
          tr.addEventListener('click', () => openModal(tx.id));
          tbody.appendChild(tr);
        });
      }

      function applyFilters() {
        const search = document.getElementById('search').value.toLowerCase();
        const stateFilter = document.getElementById('state-filter').value;
        const typeFilter = document.getElementById('type-filter').value;

        const filtered = allTransactions.filter(tx => {
          const ref = (tx.reference ?? '').toLowerCase();
          const type = (tx.type ?? '').toLowerCase();
          const matchesSearch = !search || ref.includes(search) || type.includes(search);
          const matchesState = !stateFilter || tx.state === stateFilter;
          const matchesType = !typeFilter || tx.type === typeFilter;
          return matchesSearch && matchesState && matchesType;
        });

        renderRows(filtered);
        document.getElementById('status').textContent = `${filtered.length} of ${allTransactions.length} transactions`;
      }

      async function loadTransactions() {
        document.getElementById('loading').style.display = 'block';
        document.getElementById('tx-table').style.display = 'none';
        document.getElementById('empty-state').style.display = 'none';
        document.getElementById('status').textContent = 'Loading…';

        try {
          const res = await fetch('/api/transactions');
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          allTransactions = await res.json();
          applyFilters();
        } catch (err) {
          document.getElementById('loading').textContent =
            'Failed to load transactions. ' + err.message;
          document.getElementById('status').textContent = 'Error';
        }
      }

      async function openModal(id) {
        document.getElementById('modal-title').textContent = `Transaction: ${id}`;
        document.getElementById('modal-content').textContent = 'Loading…';
        document.getElementById('modal-overlay').classList.add('open');

        try {
          const res = await fetch(`/api/transactions/${encodeURIComponent(id)}`);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          document.getElementById('modal-content').textContent = JSON.stringify(
            data,
            null,
            2
          );
        } catch (err) {
          document.getElementById('modal-content').textContent =
            'Error loading detail: ' + err.message;
        }
      }

      document.getElementById('modal-close').addEventListener('click', () => {
        document.getElementById('modal-overlay').classList.remove('open');
      });

      document.getElementById('modal-overlay').addEventListener('click', e => {
        if (e.target === document.getElementById('modal-overlay')) {
          document.getElementById('modal-overlay').classList.remove('open');
        }
      });

      document.getElementById('refresh-btn').addEventListener('click', loadTransactions);
      document.getElementById('search').addEventListener('input', applyFilters);
      document.getElementById('state-filter').addEventListener('change', applyFilters);
      document.getElementById('type-filter').addEventListener('change', applyFilters);

      loadTransactions();
    </script>
  </body>
</html>
